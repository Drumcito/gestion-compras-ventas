---
deployment:
  tasks:
    # El sitio corre desde public_html/GABE/, no desde la raiz de public_html.
    - export DEPLOYPATH=/home/gabenet/public_html/GABE/
    - /bin/mkdir -p $DEPLOYPATH
    # Se usa cp y no rsync: con "/usr/bin/rsync -av --delete" el despliegue
    # terminaba sin copiar un solo archivo (13/09), mientras que con este
    # mismo cp si funciono. Al parecer rsync no esta disponible en esa ruta.
    #
    # Contrapartida: cp no borra. Un archivo que se elimine del repositorio
    # se queda huerfano en el servidor y hay que quitarlo a mano. A cambio,
    # config/credenciales.prod.php (que solo existe en el hosting) nunca
    # corre peligro.
    - /bin/cp -R * $DEPLOYPATH
