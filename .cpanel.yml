---
deployment:
  tasks:
    # El sitio corre desde public_html/GABE/, no desde la raiz de public_html.
    - export DEPLOYPATH=/home/gabenet/public_html/GABE/
    - /bin/mkdir -p $DEPLOYPATH
    # --delete borra del servidor lo que ya no este en el repositorio, por eso
    # se excluyen las credenciales: viven solo en el hosting (estan en
    # .gitignore) y sin este exclude el primer despliegue las borraria y
    # tumbaria produccion.
    - /usr/bin/rsync -av --delete --exclude 'credenciales.local.php' --exclude 'credenciales.prod.php' * $DEPLOYPATH
